name: Päivitä Diageo & ravintola-ala -briiffi

on:
  schedule:
    # Maanantai, keskiviikko, perjantai klo 6:00 UTC (n. 8-9 Suomen aikaa)
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python src/fetch_digest.py

      - name: Commit ja pushaa päivitetty sivu
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs data
          git diff --quiet && git diff --staged --quiet || git commit -m "Päivitä briiffi $(date -u +'%Y-%m-%d %H:%M')"
          git push
